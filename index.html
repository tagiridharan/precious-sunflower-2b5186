<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1E2124">
<link rel="manifest" href="/manifest.webmanifest">
<title>Belt — Informal E-Waste to EPR Chain of Custody</title>
<style>
  :root{
    --graphite:#1E2124;
    --graphite-2:#2A2E32;
    --copper:#B5651D;
    --copper-light:#D3854A;
    --olive:#7C9473;
    --paper:#EDE6D8;
    --paper-dim:#DCD3C0;
    --amber:#D4A017;
    --green:#4C7A4C;
    --red:#A5433A;
    --ink:#26221C;
    --font-body: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-head: "Oswald", "Arial Narrow", "Helvetica Neue Condensed", sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--graphite); color:var(--paper);
    font-family:var(--font-body); min-height:100vh;
  }
  .app{max-width:1000px;margin:0 auto;padding:0 0 60px;}

  /* Status bar */
  .statusbar{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:8px 20px; font-size:12px; background:var(--graphite-2); flex-wrap:wrap;
  }
  .status-dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px;}
  .status-dot.on{background:var(--green);}
  .status-dot.off{background:var(--red);}
  .queue-pill{
    background:var(--amber); color:#3A2E05; padding:2px 9px; border-radius:10px;
    font-weight:700; font-size:11px;
  }
  .lang-toggle{display:flex; gap:6px;}
  .lang-btn{
    background:none; border:1px solid #4A4E52; color:#B8B8B0; font-size:11px;
    padding:3px 9px; border-radius:10px; cursor:pointer; font-family:var(--font-head);
  }
  .lang-btn.active{background:var(--copper); border-color:var(--copper); color:#fff;}

  /* Header / masthead */
  .masthead{
    padding:22px 20px 18px; border-bottom:3px solid var(--copper);
    display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:8px;
  }
  .masthead h1{
    font-family:var(--font-head); font-weight:600; letter-spacing:0.5px;
    font-size:28px; margin:0; text-transform:uppercase; color:var(--paper);
  }
  .masthead h1 span{color:var(--copper-light);}
  .masthead .tagline{font-size:13px; color:#9A9A92; max-width:340px; line-height:1.4;}

  /* Role switcher */
  .roles{display:flex; gap:0; border-bottom:1px solid #3A3D40; overflow-x:auto;}
  .role-btn{
    flex:1; min-width:130px; background:none; border:none; color:#8C8C84;
    font-family:var(--font-head); font-size:14px; letter-spacing:0.4px;
    padding:14px 10px; cursor:pointer; border-bottom:3px solid transparent;
    text-transform:uppercase; position:relative;
  }
  .role-btn .lock{font-size:10px; margin-left:4px;}
  .role-btn.active{color:var(--paper); border-bottom-color:var(--copper);}
  .role-btn:hover{color:var(--paper);}

  .panel{padding:24px 20px;}
  .card{
    background:var(--paper); color:var(--ink); border-radius:2px;
    padding:20px; margin-bottom:16px;
  }
  .card h2{
    font-family:var(--font-head); text-transform:uppercase; font-size:16px;
    letter-spacing:0.5px; margin:0 0 14px; color:var(--ink); border-bottom:2px solid var(--copper);
    padding-bottom:8px;
  }
  label{display:block; font-size:13px; font-weight:600; margin:12px 0 4px; color:#4A4438;}
  input, select{
    width:100%; padding:12px; font-size:16px; border:1px solid #C4BAA4;
    border-radius:2px; background:#fff; color:var(--ink); font-family:var(--font-body);
  }
  .big-btn{
    width:100%; padding:16px; margin-top:16px; font-size:16px; font-weight:700;
    border:none; border-radius:2px; background:var(--copper); color:#fff; cursor:pointer;
    font-family:var(--font-head); letter-spacing:0.4px; text-transform:uppercase;
  }
  .big-btn:hover{background:var(--copper-light);}
  .big-btn.secondary{background:var(--olive);}
  .big-btn.ghost{background:transparent; border:1px solid #C4BAA4; color:#4A4438;}
  .big-btn.voice{background:var(--graphite); margin-top:8px;}
  .big-btn.voice.listening{background:var(--red);}
  .row{display:flex; gap:10px;}
  .row > *{flex:1;}
  .hint{font-size:12px; color:#7A7261; margin-top:4px;}

  /* AI camera scan */
  .photo-preview{width:100%; max-width:220px; border-radius:3px; margin-top:10px; display:block; border:1px solid #C4BAA4;}
  .big-btn.scan{background:var(--olive);}
  .big-btn.scan:disabled{background:#B9B2A0; cursor:not-allowed;}
  .big-btn.scan.scanning{background:var(--amber); color:#3A2E05;}
  .ai-result{
    margin-top:10px; padding:12px; background:#EAF1EA; border-left:3px solid var(--olive);
    border-radius:2px; font-size:13px; color:#33502F;
  }
  .ai-result strong{color:var(--ink);}
  .scan-progress{
    height:4px; background:#E4DCC8; border-radius:2px; margin-top:8px; overflow:hidden;
  }
  .scan-progress .bar{
    height:100%; width:40%; background:var(--olive); animation:scanmove 1s ease-in-out infinite;
  }
  @keyframes scanmove{ 0%{margin-left:-40%;} 100%{margin-left:100%;} }
  .offline-note{
    margin-top:8px; padding:8px 10px; background:#F6E6E4; border-left:3px solid var(--red);
    font-size:12px; color:#6B2E27; border-radius:2px;
  }

  /* Device inspection studio */
  .device-lab{background:#18201F;color:#E9E1D2;border:1px solid #394643;border-radius:12px;padding:0;overflow:hidden;box-shadow:0 18px 50px rgba(8,12,11,.28);}
  .device-lab h2{color:#F3EADB;border:0;margin:0;padding:20px 22px 4px;font-size:20px;letter-spacing:.8px;}
  .lab-kicker{padding:0 22px 18px;color:#99AAA4;font-family:var(--font-head);font-size:11px;letter-spacing:1.4px;text-transform:uppercase;}
  .lab-layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,.75fr);border-top:1px solid #394643;}
  .camera-stage{position:relative;min-height:390px;background:#0D1211;display:grid;place-items:center;overflow:hidden;}
  .camera-stage video,.camera-stage img{width:100%;height:100%;min-height:390px;max-height:520px;object-fit:cover;display:block;}
  .camera-placeholder{text-align:center;max-width:300px;padding:28px;color:#91A19B;}
  .camera-placeholder svg{width:66px;height:66px;margin-bottom:14px;color:#B87842;}
  .camera-placeholder strong{display:block;color:#E9E1D2;font-family:var(--font-head);font-size:18px;text-transform:uppercase;margin-bottom:7px;}
  .scan-frame{position:absolute;inset:8%;border:1px solid rgba(216,145,77,.65);pointer-events:none;}
  .scan-frame::before,.scan-frame::after{content:"";position:absolute;left:0;right:0;height:2px;background:#D8914D;box-shadow:0 0 14px rgba(216,145,77,.6);animation:labscan 2.3s ease-in-out infinite;}
  .scan-frame::after{animation-delay:-1.15s;opacity:.35;}
  @keyframes labscan{0%,100%{transform:translateY(0);opacity:.15}50%{transform:translateY(280px);opacity:1}}
  .camera-chip{position:absolute;top:18px;left:18px;background:rgba(13,18,17,.82);border:1px solid #53615D;border-radius:20px;padding:7px 11px;font:600 10px var(--font-head);letter-spacing:1px;text-transform:uppercase;}
  .camera-chip.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#C96A57;margin-right:7px;animation:pulse 1.4s infinite;}
  @keyframes pulse{50%{opacity:.35}}
  .lab-controls{padding:20px;background:#212A28;display:flex;flex-direction:column;justify-content:center;}
  .lab-status{min-height:42px;padding:10px 12px;border-radius:5px;background:#18201F;border-left:3px solid #738A7E;color:#BEC9C4;font-size:12px;line-height:1.45;margin-bottom:12px;}
  .lab-status.error{border-color:#C96A57;color:#F2C6BE;background:#2A1D1B;}
  .lab-status.success{border-color:#7EA077;color:#D7E9D3;}
  .lab-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .lab-btn{padding:12px 10px;border:1px solid #52615C;border-radius:5px;background:transparent;color:#E9E1D2;cursor:pointer;font:600 12px var(--font-head);letter-spacing:.5px;text-transform:uppercase;}
  .lab-btn:hover:not(:disabled){border-color:#D8914D;color:#F4C494;transform:translateY(-1px)}
  .lab-btn.primary{grid-column:1/-1;background:#B5651D;border-color:#B5651D;color:white;}
  .lab-btn:disabled{opacity:.35;cursor:not-allowed;}
  .analysis-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:14px 0 3px;}
  .analysis-step{font:10px var(--font-head);text-align:center;color:#66736F;text-transform:uppercase;letter-spacing:.3px;}
  .analysis-step.active{color:#F0B274;animation:pulse 1s infinite;}
  .analysis-step.done{color:#91AE8A;}
  .result-card{margin-top:16px;border:1px solid #D6CCB6;border-radius:8px;overflow:hidden;background:#F7F3E9;}
  .result-head{padding:15px 18px;background:#26302E;color:#F3EADB;font:600 14px var(--font-head);letter-spacing:1.2px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;}
  .confidence-ring{border:1px solid #71807B;border-radius:20px;padding:5px 9px;color:#AFC1BA;font-size:11px;}
  .result-body{display:grid;grid-template-columns:200px 1fr;gap:20px;padding:18px;}
  .result-photo{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:5px;background:#222;}
  .result-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px;}
  .result-field span{display:block;color:#887E6C;font:10px var(--font-head);text-transform:uppercase;letter-spacing:.7px;margin-bottom:3px;}
  .result-field strong{font-size:15px;color:#29251E;}
  .result-field.wide{grid-column:1/-1;}
  .feature-list{margin:3px 0 0;padding-left:17px;font-size:13px;color:#554E42;}
  .demo-flag{padding:9px 18px;background:#FBF1D8;color:#6B5308;font-size:12px;}
  .price-panel{padding:18px;border-top:1px solid #D6CCB6;display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:end;}
  .price-label{color:#887E6C;font:10px var(--font-head);text-transform:uppercase;letter-spacing:.7px;}
  .estimated-price{font:600 30px var(--font-head);color:#B5651D;margin-top:3px;}
  .price-note{font-size:11px;color:#887E6C;line-height:1.4;}
  .price-editor{display:grid;grid-template-columns:40px 1fr 40px;gap:6px;}
  .price-editor input{text-align:center;padding:10px;}
  .price-adjust{border:1px solid #C4BAA4;background:#fff;border-radius:3px;font-size:20px;cursor:pointer;}
  .amount-error{color:var(--red);font-size:12px;min-height:17px;margin-top:5px;}
  .set-amount{margin-top:5px;padding:11px;width:100%;border:0;border-radius:3px;background:var(--copper);color:white;font:600 12px var(--font-head);text-transform:uppercase;cursor:pointer;}
  .final-amount{margin-top:7px;color:var(--green);font-weight:700;font-size:14px;}
  .scan-again{margin:0 18px 18px;width:calc(100% - 36px);}

  /* Stamp chain */
  .stamp-chain{display:flex; align-items:center; gap:4px; margin:6px 0 2px; flex-wrap:wrap;}
  .stamp{
    font-family:var(--font-head); font-size:10px; text-transform:uppercase;
    padding:5px 8px; border-radius:2px; border:1.5px solid #C4BAA4; color:#9A9280;
    letter-spacing:0.3px; white-space:nowrap;
  }
  .stamp.done{border-color:var(--green); color:var(--green); background:#EAF1EA;}
  .stamp.flag{border-color:var(--amber); color:#8A6A0A; background:#FBF1D8;}
  .stamp.queued{border-color:var(--red); color:var(--red); background:#F6E6E4;}
  .stamp-arrow{color:#C4BAA4; font-size:12px;}

  .record{
    border:1px solid #D6CCB6; border-radius:2px; padding:14px; margin-bottom:10px; background:#F7F3E9;
  }
  .record-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap;}
  .record-title{font-weight:700; font-size:15px;}
  .record-meta{font-size:12px; color:#7A7261; margin-top:2px;}
  .anomaly{
    margin-top:10px; padding:10px; background:#FBF1D8; border-left:3px solid var(--amber);
    font-size:13px; color:#6B5308;
  }
  .empty{font-size:14px; color:#8A8272; padding:20px 0; text-align:center;}

  /* Compliance ledger */
  .stats-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:12px; margin-bottom:16px;}
  .stat{background:#F7F3E9; border:1px solid #D6CCB6; padding:14px; border-radius:2px;}
  .stat .num{font-family:var(--font-head); font-size:26px; color:var(--copper); font-weight:600;}
  .stat .lbl{font-size:11px; text-transform:uppercase; letter-spacing:0.4px; color:#7A7261; margin-top:2px;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{
    text-align:left; font-family:var(--font-head); text-transform:uppercase; font-size:11px;
    letter-spacing:0.3px; color:#7A7261; padding:8px 6px; border-bottom:2px solid var(--copper);
  }
  td{padding:8px 6px; border-bottom:1px solid #E4DCC8;}
  .badge{display:inline-block; padding:2px 7px; border-radius:10px; font-size:11px; font-weight:600;}
  .badge.credited{background:#EAF1EA; color:var(--green);}
  .badge.pending{background:#EEE7D6; color:#8A7A4A;}
  .badge.anomaly{background:#FBF1D8; color:#8A6A0A;}
  .badge.queued{background:#F6E6E4; color:var(--red);}

  /* PIN lock */
  .lock-screen{
    background:var(--paper); color:var(--ink); border-radius:2px; padding:40px 24px;
    text-align:center; max-width:320px; margin:40px auto;
  }
  .lock-screen .icon{font-size:34px; margin-bottom:10px;}
  .pin-dots{display:flex; gap:10px; justify-content:center; margin:16px 0;}
  .pin-dot{width:14px; height:14px; border-radius:50%; border:2px solid #C4BAA4;}
  .pin-dot.filled{background:var(--copper); border-color:var(--copper);}
  .keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px;}
  .keypad button{
    padding:16px 0; font-size:18px; border:1px solid #C4BAA4; background:#fff; border-radius:2px; cursor:pointer;
  }
  .keypad button:active{background:var(--paper-dim);}
  .lock-error{color:var(--red); font-size:12px; margin-top:8px; min-height:16px;}

  @media (max-width:600px){
    .masthead h1{font-size:22px;}
    .stamp{font-size:9px; padding:4px 6px;}
    .lab-layout,.result-body,.price-panel{grid-template-columns:1fr;}
    .camera-stage,.camera-stage video,.camera-stage img{min-height:300px;}
    .result-photo{max-height:260px;}
    .lab-actions{grid-template-columns:1fr;}
    .lab-btn.primary{grid-column:auto;}
    .analysis-steps{grid-template-columns:1fr 1fr;row-gap:9px;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="statusbar">
    <div>
      <span class="status-dot" id="statusDot"></span><span id="statusText">Checking connection…</span>
      <span class="queue-pill" id="queuePill" style="display:none;"></span>
    </div>
    <div class="lang-toggle" id="langToggle"></div>
  </div>

  <div class="masthead">
    <div>
      <h1>Belt<span>.</span></h1>
      <div class="tagline" id="tagline">Chain of custody for informal e-waste collection — from a collector's log to a brand's EPR credit.</div>
    </div>
  </div>

  <div class="roles" id="roleTabs"></div>
  <div class="panel" id="panel"></div>
</div>

<script>
const STORAGE_KEY = "belt-cached-collections";
const CREATE_QUEUE_KEY = "belt-offline-queue";
const UPDATE_QUEUE_KEY = "belt-offline-updates";
function readStoredArray(key){
  try{
    const value = JSON.parse(localStorage.getItem(key) || "[]");
    return Array.isArray(value) ? value : [];
  }catch(e){ return []; }
}
let collections = readStoredArray(STORAGE_KEY);
let pendingQueue = readStoredArray(CREATE_QUEUE_KEY).map(record=>({...record, synced:false}));
let pendingUpdates = readStoredArray(UPDATE_QUEUE_KEY);
let role = "collector";
let loaded = false;
let uiLang = "en";
const unlockedRoles = new Set(["collector"]); // collector needs no PIN
const ROLE_PINS = { aggregator:"1111", recycler:"2222", compliance:"3333" };
let pinInput = "";
let pinError = "";

const ROLES = [
  {id:"collector", label:"Collector"},
  {id:"aggregator", label:"Aggregator"},
  {id:"recycler", label:"Recycler"},
  {id:"compliance", label:"Brand / PRO"},
];

const ITEM_TYPES = ["Mobile phone","Laptop","CFL/LED bulb","Battery pack","PCB / circuit board","Small home appliance","Cable & wiring","Other"];

const T = {
  en: {
    tagline: "Chain of custody for informal e-waste collection — from a collector's log to a brand's EPR credit.",
    logTitle: "Log a collection", name: "Your name", city: "Pickup area (village / ward)",
    item: "Item type (AI detected)", weight: "Weight in kg (AI estimated)", photo: "Photo of the item",
    gps: "GPS stamp", captureGps: "Capture location", noGps: "No location captured yet.",
    submit: "Submit collection", recent: "Your recent logs", none: "Nothing logged yet.",
    voice: "Speak your entry instead", listening: "Listening…", voiceHint: "Say something like: two kilo mobile phone Coimbatore",
    takePhoto: "Take photo", retake: "Retake photo", photoHint: "Point the camera at the item. Analysis runs on your device — works fully offline.",
    scanBtn: "Scan with AI camera", scanning: "Analysing photo…",
    aiDetected: "AI detected", aiEditHint: "tap the fields below to correct if needed",
    voiceOffline: "Voice recognition needs a network connection on most phones. You're offline right now — type your entry, or use the AI camera scan below, which works without internet.",
  },
  ta: {
    tagline: "சேகரிப்பாளர் பதிவில் இருந்து பிராண்ட் EPR கிரெடிட் வரை — முழு கண்காணிப்பு சங்கிலி.",
    logTitle: "சேகரிப்பைப் பதிவு செய்யவும்", name: "உங்கள் பெயர்", city: "பகுதி (கிராமம் / வார்டு)",
    item: "பொருள் வகை (AI கண்டறிந்தது)", weight: "எடை கிலோவில் (AI மதிப்பீடு)", photo: "பொருளின் புகைப்படம்",
    gps: "GPS முத்திரை", captureGps: "இருப்பிடத்தைப் பிடிக்கவும்", noGps: "இன்னும் இருப்பிடம் பிடிக்கப்படவில்லை.",
    submit: "சேகரிப்பைச் சமர்ப்பிக்கவும்", recent: "உங்கள் சமீபத்திய பதிவுகள்", none: "இன்னும் எதுவும் பதிவு செய்யப்படவில்லை.",
    voice: "பேசி பதிவு செய்யவும்", listening: "கேட்கிறது…", voiceHint: "உதாரணம்: இரண்டு கிலோ மொபைல் போன் கோயம்புத்தூர்",
    takePhoto: "புகைப்படம் எடுக்கவும்", retake: "மீண்டும் எடுக்கவும்", photoHint: "கேமராவை பொருளின் மீது காட்டவும். பகுப்பாய்வு உங்கள் சாதனத்திலேயே நடக்கும் — இணையம் இல்லாமலும் வேலை செய்யும்.",
    scanBtn: "AI கேமராவால் ஸ்கேன் செய்யவும்", scanning: "புகைப்படம் பகுப்பாய்வு செய்யப்படுகிறது…",
    aiDetected: "AI கண்டறிந்தது", aiEditHint: "தேவைப்பட்டால் கீழே உள்ள புலங்களைத் தொட்டு திருத்தவும்",
    voiceOffline: "பெரும்பாலான போன்களில் குரல் அறிதலுக்கு இணையம் தேவை. நீங்கள் இப்போது ஆஃப்லைனில் உள்ளீர்கள் — தட்டச்சு செய்யவும் அல்லது இணையம் இல்லாமல் வேலை செய்யும் AI கேமரா ஸ்கேனைப் பயன்படுத்தவும்.",

async function apiRequest(method="GET", body){
  const response = await fetch("/api/collections", {
    method,
    headers: body ? {"Content-Type":"application/json"} : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await response.json().catch(()=>({}));
  if(!response.ok) throw new Error(data.error || "Ledger request failed");
  return data;
}

/* ---------- CONNECTIVITY & OFFLINE QUEUE ---------- */
function updateStatus(){
  const dot = document.getElementById("statusDot");
  const txt = document.getElementById("statusText");
  const pill = document.getElementById("queuePill");
  const online = navigator.onLine;
  const queuedCount = pendingQueue.length + pendingUpdates.length;
  dot.className = "status-dot " + (online ? "on" : "off");
  txt.textContent = online ? (queuedCount ? "Online — syncing queued changes" : "Online — synced") : "Offline — changes will queue on this device";
  if(queuedCount > 0){
    pill.style.display = "inline-block";
    pill.textContent = queuedCount + " queued";
  } else {
    pill.style.display = "none";
  }
}
window.addEventListener("online", ()=>{ updateStatus(); flushQueue(); });
window.addEventListener("offline", updateStatus);

async function flushQueue(){
  if(!navigator.onLine || (pendingQueue.length===0 && pendingUpdates.length===0)) return;
  const remainingCreates = [];
  for(const record of pendingQueue){
    try{
      const saved = await apiRequest("POST", record);
      const index = collections.findIndex(item=>item.id===saved.id);
      if(index >= 0) collections[index] = saved; else collections.push(saved);
    }catch(e){ remainingCreates.push(record); }
  }
  pendingQueue = remainingCreates;
  const remainingUpdates = [];
  for(const record of pendingUpdates){
    try{
      const saved = await apiRequest("PATCH", record);
      const index = collections.findIndex(item=>item.id===saved.id);
      if(index >= 0) collections[index] = saved;
    }catch(e){ remainingUpdates.push(record); }
  }
  pendingUpdates = remainingUpdates;
  persistState();
  updateStatus();
  render();
}

async function loadData(){
  try{
    collections = await apiRequest();
    persistState();
  }catch(e){}
  loaded = true;
  updateStatus();
  render();
  if(navigator.onLine && (pendingQueue.length || pendingUpdates.length)) await flushQueue();
}

async function saveData(record){
  const snapshot = {...record};
  const index = collections.findIndex(item=>item.id===record.id);
  if(index >= 0) collections[index] = snapshot;
  try{
    const saved = await apiRequest("PATCH", record);
    if(index >= 0) collections[index] = saved;
    persistState();
    return saved;
  }catch(e){
    const queuedIndex = pendingUpdates.findIndex(item=>item.id===record.id);
    if(queuedIndex >= 0) pendingUpdates[queuedIndex] = snapshot; else pendingUpdates.push(snapshot);
    persistState();
    updateStatus();
    return snapshot;
  }
}

/* ---------- STAMP CHAIN ---------- */
function stampChain(rec){
  const stages = [
    {key:"logged", label: rec.synced===false ? "Queued (offline)" : "Logged"},
    {key:"pickup_confirmed", label:"Picked up"},
    {key:"received", label:"Received"},
    {key:"credited", label:"EPR Credited"},
  ];
  const order = ["logged","pickup_confirmed","received","credited"];
  const currentIdx = order.indexOf(rec.status);
  let html = '<div class="stamp-chain">';
  stages.forEach((s, i)=>{
    const done = i <= currentIdx;
    const flagged = rec.anomaly && s.key === "pickup_confirmed";
    const queued = s.key==="logged" && rec.synced===false;
    let cls = "";
    if(queued) cls = "queued"; else if(done) cls = flagged ? "flag" : "done";
    html += `<span class="stamp ${cls}">${s.label}</span>`;
    if(i < stages.length-1) html += '<span class="stamp-arrow">→</span>';
  });
  html += '</div>';
  return html;
}

}
function parseVoiceEntry(text){
  document.getElementById("voiceTranscript") && (document.getElementById("voiceTranscript").textContent = '"' + text + '"');
  const lower = text.toLowerCase();
  // weight: first number found (supports "two" -> not handled, digits only for reliability)
  const numMatch = lower.match(/(\d+(\.\d+)?)/);
  if(numMatch){ formState.weight = numMatch[1]; document.getElementById("cWeight").value = numMatch[1]; }
  // item type: match against known list (English + Tamil + Kannada + Hindi + Telugu keywords)
  const itemKeywords = {
    "mobile":"Mobile phone","phone":"Mobile phone","போன்":"Mobile phone","மொபைல்":"Mobile phone",
    "ಮೊಬೈಲ್":"Mobile phone","ಫೋನ್":"Mobile phone","मोबाइल":"Mobile phone","फोन":"Mobile phone",
    "మొబైల్":"Mobile phone","ఫోన్":"Mobile phone",
    "laptop":"Laptop","லேப்டாப்":"Laptop","ಲ್ಯಾಪ್‌ಟಾಪ್":"Laptop","लैपटॉप":"Laptop","ల్యాప్‌టాప్":"Laptop",
    "bulb":"CFL/LED bulb","led":"CFL/LED bulb","பல்பு":"CFL/LED bulb","ಬಲ್ಬ್":"CFL/LED bulb","बल्ब":"CFL/LED bulb","బల్బు":"CFL/LED bulb",
    "battery":"Battery pack","பேட்டரி":"Battery pack","ಬ್ಯಾಟರಿ":"Battery pack","बैटरी":"Battery pack","బ్యాటరీ":"Battery pack",
    "board":"PCB / circuit board","pcb":"PCB / circuit board","சர்க்யூட்":"PCB / circuit board","ಸರ್ಕ್ಯೂಟ್":"PCB / circuit board","सर्किट":"PCB / circuit board","సర్క్యూట్":"PCB / circuit board",
    "appliance":"Small home appliance","சாதனம்":"Small home appliance","ಉಪಕರಣ":"Small home appliance","उपकरण":"Small home appliance","పరికరం":"Small home appliance",
    "cable":"Cable & wiring","wire":"Cable & wiring","கேபிள்":"Cable & wiring","ಕೇಬಲ್":"Cable & wiring","केबल":"Cable & wiring","తీగ":"Cable & wiring","కేబుల్":"Cable & wiring"
  };
  let matchedItem = null;
  for(const k in itemKeywords){ if(lower.includes(k.toLowerCase()) || text.includes(k)){ matchedItem = itemKeywords[k]; break; } }
  if(matchedItem){ formState.item = matchedItem; document.getElementById("cItem").value = matchedItem; }
  // whatever's left, drop into city field as a best-effort guess if city is empty
  const cityField = document.getElementById("cCity");
  if(cityField && !cityField.value){
    let remainder = text;
    if(numMatch) remainder = remainder.replace(numMatch[1], "");
    Object.keys(itemKeywords).forEach(k=>{ remainder = remainder.replace(new RegExp(k,"ig"), ""); });
    remainder = remainder.replace(/kg|kilo|kilos/ig, "").trim();
    if(remainder.length > 1){ cityField.value = remainder; formState.city = remainder; }
  }
}

    const video = document.getElementById("deviceVideo");
    if(video){ video.srcObject = cameraStream; await video.play(); }
  }catch(error){
    const messages = {
      NotAllowedError:"Camera permission was denied. Allow camera access in browser settings and try again.",
      NotFoundError:"No camera was detected on this device.",
      NotReadableError:"The camera is unavailable or already in use by another application.",
      OverconstrainedError:"This camera cannot provide the requested video format."
    };
    cameraMessage = messages[error.name] || "The camera could not be started. Check permissions and try again.";
    cameraError = true; render();
  }
}

function captureDevice(){
  const video = document.getElementById("deviceVideo");
  if(!video || !cameraStream || video.readyState < 2){ cameraMessage="The camera is not ready yet."; cameraError=true; render(); return; }
  const maxWidth = 1280;
  const scale = Math.min(1, maxWidth / video.videoWidth);
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(video.videoWidth * scale); canvas.height = Math.round(video.videoHeight * scale);
  canvas.getContext("2d").drawImage(video,0,0,canvas.width,canvas.height);
  capturedImage = canvas.toDataURL("image/jpeg",.84);
  canvas.toBlob(blob=>{ if(blob) capturedPhotoFile = new File([blob],"device-capture.jpg",{type:"image/jpeg"}); },"image/jpeg",.84);
  stopCamera(); cameraMessage="Photo captured. Check clarity, then analyze the device."; cameraError=false; render();
}

function retakeDevice(){
  capturedImage=""; deviceResult=null; aiScanResult=null; analysisMode=""; proposedPrice=""; finalPrice=0; amountError="";
  startDeviceCamera();
}

function imageDataUrl(){ return Promise.resolve(capturedImage); }

function mapCategoryToLedger(category){
  const value=(category||"").toLowerCase();
  if(value.includes("phone")) return "Mobile phone";
  if(value.includes("laptop")) return "Laptop";
  if(value.includes("led") || value.includes("bulb")) return "CFL/LED bulb";
  if(value.includes("battery")) return "Battery pack";
  if(value.includes("board") || value.includes("pcb") || value.includes("sensor") || value.includes("module") || value.includes("circuit")) return "PCB / circuit board";
  if(value.includes("cable") || value.includes("wire")) return "Cable & wiring";
  return "Other";
}

function conditionAdjustedPrice(price,condition){
  const multiplier={New:1.18,Excellent:1.08,Good:1,Fair:.72,Poor:.42,Unknown:.85}[condition] || .85;
  return Math.max(0,Math.round((Number(price)||0)*multiplier/10)*10);
}

async function analyzeElectronicDevice(image){
  const response=await fetch("/api/analyze-device",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({image})});
  const data=await response.json().catch(()=>({}));
  if(!response.ok) throw new Error(data.error || "Device analysis failed.");
  return data;
}

async function runAIScan(){
  if(!capturedImage){ cameraMessage="Capture a device photo before starting analysis.";cameraError=true;render();return; }
  if(!navigator.onLine){ cameraMessage="AI identification needs a network connection. Your ledger remains available offline.";cameraError=true;render();return; }
  scanning=true; analysisStep=0; cameraError=false; deviceResult=null; render();
  const timer=setInterval(()=>{ if(analysisStep<3){analysisStep++;renderDeviceProgress();} },650);
  try{
    const payload=await analyzeElectronicDevice(await imageDataUrl());
    deviceResult={...payload.analysis,image:capturedImage,finalPrice:0};
    analysisMode=payload.mode;
    const adjusted=conditionAdjustedPrice(deviceResult.estimatedPrice,deviceResult.condition);
    deviceResult.estimatedPrice=adjusted; proposedPrice=String(adjusted);
    aiScanResult={item:mapCategoryToLedger(deviceResult.category),weight:""};
    formState.item=aiScanResult.item;
    cameraMessage=deviceResult.confidence<55 ? "Device could not be identified accurately. Please capture a clearer image." : "Identification complete. Review the result and set a final amount.";
    cameraError=deviceResult.confidence<55;
  }catch(error){ cameraMessage=error.message || "AI analysis failed. Check the network and try again.";cameraError=true; }
  finally{clearInterval(timer);scanning=false;analysisStep=3;render();}
}

function renderDeviceProgress(){
  document.querySelectorAll(".analysis-step").forEach((el,index)=>{el.className="analysis-step "+(index<analysisStep?"done":index===analysisStep?"active":"");});
}

function adjustPrice(delta){ proposedPrice=String(Math.max(0,(Number(proposedPrice)||0)+delta)); const input=document.getElementById("deviceAmount");if(input)input.value=proposedPrice;amountError=""; }
function setDeviceAmount(){
  const input=document.getElementById("deviceAmount"); const value=Number(input?.value);
  if(!Number.isFinite(value)||value<0||value>10000000){amountError="Enter a valid amount between ₹0 and ₹1,00,00,000.";render();return;}
  proposedPrice=String(Math.round(value));finalPrice=Math.round(value);if(deviceResult)deviceResult.finalPrice=finalPrice;amountError="";render();
}
function scanAnotherDevice(){stopCamera();capturedImage="";capturedPhotoFile=null;deviceResult=null;aiScanResult=null;analysisMode="";proposedPrice="";finalPrice=0;amountError="";analysisStep=-1;cameraMessage="Ready for another inspection. Start the camera when positioned.";cameraError=false;render();}

function deviceCameraSection(){
  const steps=["Scanning","Identifying","Checking","Estimating value"];
  const stage=capturedImage?`<img src="${capturedImage}" alt="Captured electronic device">`:cameraStream?`<video id="deviceVideo" playsinline muted autoplay aria-label="Live camera preview"></video>`:`<div class="camera-placeholder"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="8" y="17" width="48" height="34" rx="4"/><path d="M23 17l4-6h10l4 6M32 27a8 8 0 100 16 8 8 0 000-16z"/></svg><strong>Optical bay idle</strong><span>Camera imagery stays in this preview until you choose Analyze Device.</span></div>`;
  const result=deviceResult?deviceResultCard():"";
  return `<section class="card device-lab" aria-labelledby="deviceLabTitle"><h2 id="deviceLabTitle">Identify Your Electronic Device</h2><div class="lab-kicker">AI-assisted optical inspection · INR valuation</div><div class="lab-layout"><div class="camera-stage">${stage}${cameraStream?'<div class="scan-frame"></div>':''}<div class="camera-chip ${cameraStream?'live':''}">${cameraStream?'Live camera':capturedImage?'Capture locked':'Camera offline'}</div></div><div class="lab-controls"><div class="lab-status ${cameraError?'error':deviceResult?'success':''}" role="status">${cameraMessage}</div><div class="lab-actions"><button class="lab-btn primary" type="button" onclick="startDeviceCamera()" ${cameraStream?'disabled':''}>Start Camera</button><button class="lab-btn" type="button" onclick="captureDevice()" ${!cameraStream?'disabled':''}>Capture Device</button><button class="lab-btn" type="button" onclick="retakeDevice()" ${!capturedImage?'disabled':''}>Retake Photo</button><button class="lab-btn primary" type="button" onclick="runAIScan()" ${!capturedImage||scanning?'disabled':''}>${scanning?'Analyzing…':'Analyze Device'}</button></div>${scanning?`<div class="analysis-steps">${steps.map((s,i)=>`<div class="analysis-step ${i<analysisStep?'done':i===analysisStep?'active':''}">${s}</div>`).join('')}</div>`:''}</div></div>${result}</section>`;
}

function deviceResultCard(){
  const r=deviceResult; const features=r.visibleFeatures?.length?r.visibleFeatures.map(f=>`<li>${f}</li>`).join(""):"<li>No distinct features reported</li>";
  return `<div class="result-card"><div class="result-head"><span>Electronic Device Identified</span><span class="confidence-ring">AI confidence ${r.confidence}%</span></div>${analysisMode==='demo'?'<div class="demo-flag">Demo analysis — Netlify AI Gateway is not configured in this environment.</div>':''}${r.identificationWarning?`<div class="demo-flag">${r.identificationWarning}</div>`:''}<div class="result-body"><img class="result-photo" src="${r.image}" alt="Electronic device used for identification"><div class="result-grid"><div class="result-field wide"><span>Device name</span><strong>${r.deviceName}</strong></div><div class="result-field"><span>Category</span><strong>${r.category}</strong></div><div class="result-field"><span>Brand</span><strong>${r.brand}</strong></div><div class="result-field"><span>Model</span><strong>${r.model}</strong></div><div class="result-field"><span>Condition</span><strong>${r.condition}</strong></div><div class="result-field wide"><span>Key visible features</span><ul class="feature-list">${features}</ul></div></div></div><div class="price-panel"><div><div class="price-label">Estimated Value</div><div class="estimated-price">₹${Number(r.estimatedPrice).toLocaleString('en-IN')}</div><div class="price-note">AI-assisted estimate with a ${r.condition.toLowerCase()} condition adjustment. This is not an exact market price.</div></div><div><label for="deviceAmount">Final amount (INR)</label><div class="price-editor"><button class="price-adjust" type="button" onclick="adjustPrice(-50)" aria-label="Decrease amount by 50 rupees">−</button><input id="deviceAmount" type="number" min="0" max="10000000" step="1" value="${proposedPrice}" oninput="proposedPrice=this.value;amountError=''" aria-describedby="amountError"><button class="price-adjust" type="button" onclick="adjustPrice(50)" aria-label="Increase amount by 50 rupees">+</button></div><div class="amount-error" id="amountError">${amountError}</div><button class="set-amount" type="button" onclick="setDeviceAmount()">Set Amount</button>${finalPrice||finalPrice===0&&r.finalPrice===0&&false?`<div class="final-amount">Final Amount: ₹${finalPrice.toLocaleString('en-IN')}</div>`:''}</div></div><button class="big-btn ghost scan-again" type="button" onclick="scanAnotherDevice()">Scan Another Device</button></div>`;
}

/* ---------- COLLECTOR ---------- */
function collectorView(){
  const mine = [...pendingQueue, ...collections].filter(()=>true).reverse();
  const offline = !navigator.onLine;
  return `
  <div class="card">
    <h2>${t("logTitle")}</h2>
    <button class="big-btn voice ${listening?'listening':''}" onclick="startVoice()" type="button">
      ${listening ? t("listening") : t("voice")}
    </button>
    <div class="hint">${t("voiceHint")}</div>
    ${offline ? `<div class="offline-note">${t("voiceOffline")}</div>` : ""}
    <div class="hint" id="voiceTranscript" style="font-style:italic;"></div>

    <label for="cName">${t("name")}</label>
    <input id="cName" value="${formState.name}" oninput="formState.name=this.value" placeholder="e.g. Ramesh Kumar">
    <label for="cCity">${t("city")}</label>
    <input id="cCity" value="${formState.city}" oninput="formState.city=this.value" placeholder="e.g. Vellalur, Coimbatore">

    ${deviceCameraSection()}

    <div class="row">
      <div>
        <label for="cItem">${t("item")}</label>
        <select id="cItem" onchange="formState.item=this.value">${ITEM_TYPES.map(ty=>`<option ${formState.item===ty?"selected":""}>${ty}</option>`).join("")}</select>
      </div>
      <div>
        <label for="cWeight">${t("weight")}</label>
        <input id="cWeight" type="number" step="0.01" min="0" value="${formState.weight}" oninput="formState.weight=this.value" placeholder="e.g. 2.5">
      </div>
    </div>

    <label>${t("gps")}</label>
    <button class="big-btn ghost" onclick="captureGPS()" type="button">${t("captureGps")}</button>
    <div class="hint" id="gpsStatus">${t("noGps")}</div>
    <button class="big-btn" onclick="submitCollection()">${t("submit")}</button>
    <div class="hint">Offline right now? Your entry queues on this device and syncs the moment you're back online.</div>
  </div>
  <div class="card">
    <h2>${t("recent")}</h2>
    ${mine.length===0 ? `<div class="empty">${t("none")}</div>` : mine.slice(0,8).map(recordCard).join("")}
  </div>`;
}

let capturedGPS = null;
function captureGPS(){
  const status = document.getElementById("gpsStatus");
  if(!navigator.geolocation){
    capturedGPS = {lat:11.0168, lng:76.9558, mocked:true};
    status.textContent = "Geolocation unavailable — using mock coordinates for demo.";
    return;
  }
  status.textContent = "Locating…";
  navigator.geolocation.getCurrentPosition(
    pos=>{
      capturedGPS = {lat:pos.coords.latitude, lng:pos.coords.longitude, mocked:false};
      status.textContent = `Captured: ${capturedGPS.lat.toFixed(4)}, ${capturedGPS.lng.toFixed(4)}`;
    },
    err=>{
      capturedGPS = {lat:11.0168, lng:76.9558, mocked:true};
      status.textContent = "Permission denied — using mock coordinates for demo.";
    }
  );
}

async function submitCollection(){
  const name = formState.name.trim();
  const city = formState.city.trim();
  const item = formState.item;
  const weight = parseFloat(formState.weight);
  const photoFile = capturedPhotoFile;

  if(!name || !city || !weight || weight<=0){
    alert("Please fill collector name, area, and take a photo so weight can be estimated.");
    return;
  }
  const rec = {
    id: uid(),
    collector: name,
    city: city,
    item: item,
    loggedWeight: weight,
    weightSource: aiScanResult ? "ai_camera" : "manual",
    photoCaptured: !!photoFile,
    photoHash: photoFile ? ("ph_" + Math.random().toString(36).slice(2,10)) : null,
    gps: capturedGPS || {lat:null, lng:null, mocked:true},
    status: "logged",
    anomaly: false,
    anomalyNote: "",
    verifiedWeight: null,
    points: 0,
    loggedAt: nowStr(),
    synced: navigator.onLine,
  };

  if(navigator.onLine){
    try{
      const saved = await apiRequest("POST", rec);
      collections.push(saved);
    }catch(e){
      pendingQueue.push({...rec, synced:false});
      persistState();
    }
  } else {
    pendingQueue.push(rec);
    persistState();
  }

  formState = { name:"", city:"", item: ITEM_TYPES[0], weight:"" };
  stopCamera();
  capturedImage = "";
  photoPreviewUrl = null;
  capturedPhotoFile = null;
  aiScanResult = null;
  deviceResult = null;
  proposedPrice = "";
  finalPrice = 0;
  capturedGPS = null;
  updateStatus();
  render();
}

function recordCard(rec){
  return `
  <div class="record">
    <div class="record-top">
      <div>
        <div class="record-title">${rec.item} — ${rec.loggedWeight} kg ${rec.weightSource==="ai_camera" ? "AI scanned" : ""}</div>
        <div class="record-meta">${rec.collector} · ${rec.city} · ${rec.loggedAt} · #${rec.id}</div>
      </div>
      <div>${rec.status==="credited" ? `<span class="badge credited">+${rec.points} pts</span>` : rec.synced===false ? `<span class="badge queued">Queued</span>` : rec.anomaly ? `<span class="badge anomaly">Flagged</span>` : `<span class="badge pending">In progress</span>`}</div>
    </div>
    ${stampChain(rec)}
    ${rec.anomaly ? `<div class="anomaly">Weight mismatch at pickup: logged ${rec.loggedWeight} kg vs verified ${rec.verifiedWeight} kg. ${rec.anomalyNote}</div>` : ""}
  </div>`;
}

/* ---------- AGGREGATOR ---------- */
function aggregatorView(){
  const pending = collections.filter(c=>c.status==="logged");
  return `
  <div class="card">
    <h2>Pending pickups (${pending.length})</h2>
    ${pending.length===0 ? '<div class="empty">No collector logs waiting for pickup confirmation.</div>' :
      pending.map(rec => `
      <div class="record">
        <div class="record-top">
          <div>
            <div class="record-title">${rec.item} — logged ${rec.loggedWeight} kg</div>
            <div class="record-meta">${rec.collector} · ${rec.city} · ${rec.loggedAt} · #${rec.id}</div>
          </div>
        </div>
        ${stampChain(rec)}
        <label>Verified weight at pickup (kg)</label>
        <input type="number" step="0.1" id="verify_${rec.id}" placeholder="Weigh and enter">
        <button class="big-btn secondary" onclick="confirmPickup('${rec.id}')">Confirm pickup</button>
      </div>`).join("")
    }
    <div class="hint">Tolerance: verified weight must be within 20% of the collector's logged weight, or the record is auto-flagged for review.</div>
  </div>`;
}

async function confirmPickup(id){
  const rec = collections.find(c=>c.id===id);
  const input = document.getElementById("verify_"+id);
  const verified = parseFloat(input.value);
  if(!verified || verified<=0){ alert("Enter the verified weight."); return; }
  rec.verifiedWeight = verified;
  const diff = Math.abs(verified - rec.loggedWeight) / rec.loggedWeight;
  rec.anomaly = diff > 0.2;
  rec.anomalyNote = rec.anomaly ? "Exceeds 20% tolerance — requires aggregator sign-off note before recycler receipt." : "";
  rec.status = "pickup_confirmed";
  await saveData(rec);
  render();
}

/* ---------- RECYCLER ---------- */
function recyclerView(){
  const inTransit = collections.filter(c=>c.status==="pickup_confirmed");
  return `
  <div class="card">
    <h2>Awaiting receipt (${inTransit.length})</h2>
    ${inTransit.length===0 ? '<div class="empty">Nothing in transit right now.</div>' :
      inTransit.map(rec => `
      <div class="record">
        <div class="record-top">
          <div>
            <div class="record-title">${rec.item} — ${rec.verifiedWeight} kg verified</div>
            <div class="record-meta">${rec.collector} · ${rec.city} · #${rec.id}</div>
          </div>
        </div>
        ${stampChain(rec)}
        ${rec.anomaly ? `<div class="anomaly">This lot was flagged for a weight mismatch at pickup. Confirming receipt will still issue credit — flag stays on the audit record for the compliance team.</div>` : ""}
        <button class="big-btn secondary" onclick="confirmReceipt('${rec.id}')">Confirm receipt → issue EPR credit</button>
      </div>`).join("")
    }
  </div>`;
}

async function confirmReceipt(id){
  const rec = collections.find(c=>c.id===id);
  rec.status = "credited";
  rec.receivedAt = new Date().toISOString();
  rec.points = Math.round(rec.verifiedWeight * 10);
  rec.creditedAt = new Date().toISOString();
  await saveData(rec);
  render();
}

/* ---------- COMPLIANCE ---------- */
function complianceView(){
  const credited = collections.filter(c=>c.status==="credited");
  const totalCreditedKg = credited.reduce((s,c)=>s+c.verifiedWeight,0);
  const anomalyCount = collections.filter(c=>c.anomaly).length;
  const target = 500;
  const pct = Math.min(100, Math.round((totalCreditedKg/target)*100));

  const byCity = {};
  credited.forEach(c=>{ byCity[c.city] = (byCity[c.city]||0) + c.verifiedWeight; });

  const rows = collections.slice().reverse().map(c=>`
    <tr>
      <td>#${c.id}</td><td>${c.city}</td><td>${c.item}</td>
      <td>${c.status==="credited" ? c.verifiedWeight : c.loggedWeight} kg</td>
      <td>${c.status==="credited" ? `<span class="badge credited">Credited</span>` : c.anomaly ? `<span class="badge anomaly">Flagged</span>` : `<span class="badge pending">${c.status.replace('_',' ')}</span>`}</td>
    </tr>`).join("");

  return `
  <div class="card">
    <h2>EPR obligation vs fulfillment</h2>
    <div class="stats-grid">
      <div class="stat"><div class="num">${totalCreditedKg.toFixed(1)} kg</div><div class="lbl">Credited to date</div></div>
      <div class="stat"><div class="num">${target} kg</div><div class="lbl">Mock quarterly target</div></div>
      <div class="stat"><div class="num">${pct}%</div><div class="lbl">Fulfilled</div></div>
      <div class="stat"><div class="num">${anomalyCount}</div><div class="lbl">Flagged records</div></div>
    </div>
  </div>
  <div class="card">
    <h2>Informal channel attribution by area</h2>
    ${Object.keys(byCity).length===0 ? '<div class="empty">No credited collections yet.</div>' :
      Object.entries(byCity).map(([city,kg])=>`
        <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #E4DCC8;">
          <span>${city}</span><strong>${kg.toFixed(1)} kg</strong>
        </div>`).join("")
    }
  </div>
  <div class="card">
    <h2>Full ledger</h2>
    <table>
      <thead><tr><th>ID</th><th>Area</th><th>Item</th><th>Weight</th><th>Status</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="5" class="empty">No records yet.</td></tr>'}</tbody>
    </table>
    <button class="big-btn ghost" onclick="generateCPCBReport()">Generate CPCB-ready report (.txt)</button>
  </div>`;
}

function generateCPCBReport(){
  const credited = collections.filter(c=>c.status==="credited");
  const totalKg = credited.reduce((s,c)=>s+c.verifiedWeight,0);
  let text = "CPCB EPR COMPLIANCE SUMMARY\nGenerated: " + nowStr() + "\n" + "=".repeat(50) + "\n\n";
  text += `Total credited weight: ${totalKg.toFixed(2)} kg\nTotal credited lots: ${credited.length}\n`;
  text += `Flagged/anomaly lots: ${collections.filter(c=>c.anomaly).length}\n\nLOT-LEVEL DETAIL\n` + "-".repeat(50) + "\n";
  credited.forEach(c=>{
    text += `#${c.id} | ${c.city} | ${c.item} | ${c.verifiedWeight} kg | collector: ${c.collector} | logged: ${c.loggedAt} | credited: ${c.creditedAt}${c.anomaly ? " | FLAGGED: "+c.anomalyNote : ""}\n`;
  });
  const blob = new Blob([text], {type:"text/plain"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "cpcb_epr_report.txt";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function render(){
  renderLangToggle();
  renderTabs();
  document.getElementById("panel").innerHTML = loaded ? panelHtml() : '<div class="empty">Loading…</div>';
}

render();
loadData();
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>navigator.serviceWorker.register("/service-worker.js"));
}
</script>
